<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <title>Брайт · Вход в панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/tokens.css?v=20261027-panel" />
    <link rel="stylesheet" href="/static/admin.css?v=20261027-panel" />
  </head>
  <body class="login-page">
    <main class="card login-card">
      <p class="brand"><span class="brand-dot">Б</span> Брайт · Панель</p>
      <h1>Вход для оператора</h1>
      <form class="login-form" id="login-form">
        <input class="field" name="username" autocomplete="username" placeholder="Логин" required />
        <input class="field" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required />
        <button class="btn primary block" type="submit">Войти</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("login-error");
        error.textContent = "";
        const form = new FormData(event.currentTarget);
        const response = await fetch("/api/v1/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: form.get("username"), password: form.get("password") }),
        });
        if (!response.ok) {
          error.textContent = "Неверный логин или пароль.";
          return;
        }
        window.location.href = "/admin/orders";
      });
    </script>
  </body>
</html>
